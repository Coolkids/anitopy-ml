openapi: 3.1.0
info:
  title: Anitopy-ML 本地解析接口
  version: 0.1.0
  description: 本地运行的媒体标题解析接口。所有请求和响应均使用 UTF-8 JSON。
servers:
  - url: http://127.0.0.1:8000
paths:
  /healthz:
    get:
      summary: 检查模型是否已成功加载
      responses:
        '200':
          description: 服务和模型可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ConfigurationError'
  /v1/parse:
    post:
      summary: 解析单条媒体标题
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  description: 原始媒体标题，默认最多4096个Unicode字符。
      responses:
        '200':
          description: 解析成功
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/ParseResult'
        '400':
          $ref: '#/components/responses/InputError'
        '503':
          $ref: '#/components/responses/ConfigurationError'
  /v1/parse-batch:
    post:
      summary: 按输入顺序批量解析媒体标题
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titles]
              properties:
                titles:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                on_error:
                  type: string
                  enum: [record, raise]
                  default: record
                  description: record会在对应位置返回错误记录；raise会使整个请求失败。
      responses:
        '200':
          description: 批量解析成功
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/ParseResult'
                        - $ref: '#/components/schemas/RecordError'
        '400':
          $ref: '#/components/responses/InputError'
        '503':
          $ref: '#/components/responses/ConfigurationError'
components:
  responses:
    InputError:
      description: 请求格式、标题内容或请求大小无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConfigurationError:
      description: 模型目录、依赖或设备配置不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status, model_directory, model_version, device]
      properties:
        status:
          type: string
          enum: [ok]
        model_directory:
          type: string
        model_version:
          type: string
        device:
          type: string
          enum: [auto, cpu, cuda]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    RecordError:
      type: object
      required: [raw_text, status, warnings]
      properties:
        raw_text: {}
        status:
          type: string
          enum: [error]
        warnings:
          type: array
          items:
            type: string
    ParseResult:
      type: object
      required: [raw_text, extracted, evidence, schema_version, model_version, normalizer_version, status, link_status, warnings]
      properties:
        raw_text:
          type: string
        extracted:
          type: object
          description: 规范化后的标题、别名、季集和辅助字段。
        evidence:
          type: object
          additionalProperties:
            type: object
            description: 包含原文片段、偏移、来源、置信度和校准状态。
        schema_version:
          type: string
        model_version:
          type: string
        normalizer_version:
          type: string
        status:
          type: string
          enum: [ok, partial]
        link_status:
          type: string
        warnings:
          type: array
          items:
            type: string
